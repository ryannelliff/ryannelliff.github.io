<!DOCTYPE html>
<html data-theme="mytheme" lang="en">

<head>
    <!-- Meta Tags-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ryann Elliff — Portfolio</title>
    <meta name="description"
        content="Portfolio website of Ryann Elliff — showcasing web development, design, projects, and experience." />

    <meta name="author" content="Your Name" />
    <meta name="theme-color" content="#0f172a" />

    <meta name="robots" content="index, follow" />

    <!-- Shows search engines that this is your preferred "master" file -->
    <link rel="canonical" href="https://ryannelliff.com/" />


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const messages = [
                { text: "Hi, I'm Ryann.", style: '', newLine: true },
                { text: "A Kansas City-based designer with a mind for", style: '', newLine: true },
                { text: "visual storytelling, social media marketing,", style: 'bold-italic', newLine: true },
                { text: " and ", style: '', newLine: false },
                { text: "brand creation.", style: 'bold-italic', newLine: false }
            ];

            const el = document.getElementById('type-text');
            const TYPING_SPEED = 55;
            const DELETING_SPEED = 30;
            const BETWEEN_SEGMENT_PAUSE = 200;
            const END_PAUSE = 2200;

            el.innerHTML = '';
            const container = document.createElement('div');
            container.className = 'typed-wrapper';
            el.appendChild(container);

            let msgIndex = 0;
            let charIndex = 0;
            const spans = []; // track created spans for reverse deletion

            let deleting = false;

            function applyClassesForStyle(span, style) {
                span.classList.remove('style-bold', 'style-italic');
                if (style === 'bold' || style === 'bold-italic') span.classList.add('style-bold');
                if (style === 'italic' || style === 'bold-italic') span.classList.add('style-italic');
            }

            function typeNextChar() {
                const current = messages[msgIndex];
                let currentSpan = container.querySelector('.current');
                if (!currentSpan) {
                    // if this segment should start on a new line and container isn't empty, insert br
                    if (current.newLine && container.childNodes.length > 0) container.appendChild(document.createElement('br'));
                    currentSpan = document.createElement('span');
                    currentSpan.className = 'current segment';
                    applyClassesForStyle(currentSpan, current.style);
                    container.appendChild(currentSpan);
                }

                charIndex++;
                currentSpan.textContent = current.text.slice(0, charIndex);

                if (charIndex >= current.text.length) {
                    // finalize this segment
                    currentSpan.classList.remove('current');
                    spans.push(currentSpan);
                    msgIndex++;
                    charIndex = 0;
                    if (msgIndex >= messages.length) {
                        // finished all segments; pause then start reverse deletion
                        setTimeout(() => {
                            deleting = true;
                            startReverseDeletion();
                        }, END_PAUSE);
                        return;
                    }
                    setTimeout(typeNextChar, BETWEEN_SEGMENT_PAUSE);
                } else {
                    setTimeout(typeNextChar, TYPING_SPEED);
                }
            }

            function startReverseDeletion() {
                let delIndex = spans.length - 1;
                let delChar = spans[delIndex] ? spans[delIndex].textContent.length : 0;

                function deleteStep() {
                    if (delIndex < 0) {
                        // finished deleting everything, restart typing after a short pause
                        spans.length = 0;
                        deleting = false;
                        setTimeout(() => {
                            container.innerHTML = '';
                            msgIndex = 0;
                            charIndex = 0;
                            setTimeout(typeNextChar, BETWEEN_SEGMENT_PAUSE);
                        }, BETWEEN_SEGMENT_PAUSE);
                        return;
                    }

                    const span = spans[delIndex];
                    if (!span) {
                        delIndex--;
                        delChar = spans[delIndex] ? spans[delIndex].textContent.length : 0;
                        setTimeout(deleteStep, DELETING_SPEED);
                        return;
                    }

                    delChar--;
                    if (delChar >= 0) {
                        span.textContent = span.textContent.slice(0, delChar);
                    }

                    if (delChar <= 0) {
                        // remove span and any preceding br that was added for newLine
                        const prev = span.previousSibling;
                        span.remove();
                        if (prev && prev.nodeName === 'BR') prev.remove();
                        spans.pop();
                        delIndex--;
                        delChar = spans[delIndex] ? spans[delIndex].textContent.length : 0;
                        setTimeout(deleteStep, DELETING_SPEED);
                        return;
                    }

                    setTimeout(deleteStep, DELETING_SPEED);
                }

                deleteStep();
            }

            typeNextChar();
        });
    </script>

    <!-- Daisy UI CSS plugin  -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
